name: Build Android APK (Cordova)

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assemble web app into Cordova www
        run: |
          mkdir -p mobile/www
          cp -r index.html css js vendor mobile/www/

      - name: Install Cordova and add Android platform
        working-directory: mobile
        run: |
          npm install
          npx cordova platform add android@14

      - name: Build debug APK
        working-directory: mobile
        run: npx cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmfy-debug-apk
          path: mobile/platforms/android/app/build/outputs/apk/debug/app-debug.apk
