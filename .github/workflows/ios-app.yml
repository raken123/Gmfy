name: Build iOS App (Cordova)

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assemble web app into Cordova www
        run: |
          mkdir -p mobile/www
          cp -r index.html css js vendor mobile/www/

      - name: Install Cordova and add iOS platform
        working-directory: mobile
        run: |
          npm install
          npx cordova platform add ios@7

      - name: Build (unsigned, device)
        working-directory: mobile/platforms/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath ./derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: mobile/platforms/ios
        run: |
          APP=$(find derived -name "*.app" -path "*Release-iphoneos*" | head -1)
          echo "app bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Gmfy-unsigned.ipa Payload
          ls -la Gmfy-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmfy-ios-unsigned-ipa
          path: mobile/platforms/ios/Gmfy-unsigned.ipa
